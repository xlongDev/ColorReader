name: Release

on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux bundling dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Run Rust gates before bundling
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. This is the minisign keypair from
          # `pnpm tauri signer generate` — self-generated, so no Apple or
          # Microsoft account is involved. The public half is pinned in
          # `tauri.conf.json`; the private half lives only in this secret, and
          # losing it means no further updates can ever be published to installs
          # that are already out there.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Platform code signing is still absent (no Apple certificate), so the
          # artifacts ship ad-hoc signed on macOS. To enable later:
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
        with:
          projectPath: "."
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "ColorReader ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install ColorReader."
          # Published, not drafted: the updater endpoint is
          # `releases/latest/download/latest.json`, and GitHub's "latest"
          # deliberately skips drafts — a drafted release would leave every
          # installed app checking forever and never seeing anything.
          releaseDraft: false
          prerelease: false
          # Writes `latest.json` (version + per-platform url + signature) next to
          # the bundles. It is populated from the signing key above; without that
          # secret the file is skipped and the updater has nothing to read.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
