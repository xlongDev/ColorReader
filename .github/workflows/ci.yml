name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI has no proxy injecting NODE_OPTIONS, so plain verify works here.
      - run: pnpm verify
      # `verify` builds dist, which is what the preview server serves. Without
      # this step nothing ever ran the e2e suite and it rotted unnoticed.
      # Both engines: `playwright.config.ts` runs every test twice on purpose,
      # and WebKit is the one the shipped Tauri binary actually renders with —
      # installing chromium alone left the webkit project failing to launch
      # (and the whole job red) since this step was added.
      - run: pnpm exec playwright install --with-deps chromium webkit
      # TEMPORARY DIAGNOSTIC — revert once the failing test is named.
      - name: Run e2e (diagnostic)
        run: |
          set +e
          pnpm test:e2e > /tmp/e2e.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            awk '/^[[:space:]]+[0-9]+\) /{ if (n++) print line; line = "" }
                 n { line = (line == "" ? "" : line " | ") $0 }
                 END { if (n) print line }' /tmp/e2e.log \
              | cut -c1-900 | while IFS= read -r line; do echo "::error::E2E $line"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-trace
          path: test-results/
          if-no-files-found: ignore
      - name: Report bundle size
        run: |
          echo "## Bundle size" >> "$GITHUB_STEP_SUMMARY"
          du -k dist/assets/*.js | sort -rn | head -5 >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri's Linux crates (gtk/glib/webkit) need their system libraries at
      # build time even though the tests themselves are headless.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      # Tests run headless SQLite only; no Tauri window is spawned.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
