name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI has no proxy injecting NODE_OPTIONS, so plain verify works here.
      - run: pnpm verify
      # `verify` builds dist, which is what the preview server serves. Without
      # this step nothing ever ran the e2e suite and it rotted unnoticed.
      # Both engines: `playwright.config.ts` runs every test twice on purpose,
      # and WebKit is the one the shipped Tauri binary actually renders with —
      # installing chromium alone left the webkit project failing to launch
      # (and the whole job red) since this step was added.
      - run: pnpm exec playwright install --with-deps chromium webkit
      # The job log and the `test-results` artifact both need admin rights to
      # download (403), so a red e2e used to say nothing but "exit code 1" —
      # seven runs in a row failed and nobody could tell which test. Keep the
      # step from killing the job, print the failures as annotations (which the
      # public check-runs API does serve), and fail at the end instead.
      - name: Run e2e
        id: e2e
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee e2e.log
      # GitHub keeps only 10 annotations per step and silently drops the rest,
      # so collapse each failure block into ONE line (`N) [project] › spec ›
      # test` + its message) before emitting — one annotation per failing test,
      # and the Expected/Received survive the cut.
      - name: Annotate e2e failures
        if: ${{ steps.e2e.outcome == 'failure' }}
        run: |
          awk '/^[[:space:]]+[0-9]+\) /{ if (b) print b; b=$0; next } { if (b) b=b " " $0 } END { if (b) print b }' e2e.log |
            head -20 |
            while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | cut -c1-900)"
            done
      - name: Fail the job if e2e failed
        if: ${{ steps.e2e.outcome == 'failure' }}
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-trace
          path: |
            test-results/
            e2e.log
          if-no-files-found: ignore
      - name: Report bundle size
        run: |
          echo "## Bundle size" >> "$GITHUB_STEP_SUMMARY"
          du -k dist/assets/*.js | sort -rn | head -5 >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri's Linux crates (gtk/glib/webkit) need their system libraries at
      # build time even though the tests themselves are headless.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      # Tests run headless SQLite only; no Tauri window is spawned.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
