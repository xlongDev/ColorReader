name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI has no proxy injecting NODE_OPTIONS, so plain verify works here.
      - run: pnpm verify
      - name: Report bundle size
        run: |
          echo "## Bundle size" >> "$GITHUB_STEP_SUMMARY"
          du -k dist/assets/*.js | sort -rn | head -5 >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri's Linux crates (gtk/glib/webkit) need their system libraries at
      # build time even though the tests themselves are headless.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      # Tests run headless SQLite only; no Tauri window is spawned.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      # TEMPORARY DIAGNOSTIC — revert once the Linux-only clippy failure is
      # understood. The job log cannot be read from outside (the API needs
      # admin rights), so the failure is echoed into the run's annotations and
      # summary instead.
      - name: Clippy (output captured)
        run: |
          set +e
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | tee clippy.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            python3 -c "
          import pathlib
          tail = pathlib.Path('clippy.log').read_text(errors='replace')[-2000:]
          print('::error::' + tail.replace('\n', '%0A'))
          "
            {
              echo '### clippy 失败'
              echo '```'
              tail -80 clippy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
      - run: cargo test --manifest-path src-tauri/Cargo.toml
