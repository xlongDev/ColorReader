[package]
name = "colorreader"
version = "0.1.0"
description = "ColorReader - AI native, local first, high performance ebook reader"
authors = ["xlongDev"]
edition = "2024"
rust-version = "1.88"
default-run = "colorreader"

[lib]
name = "colorreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zip = "8"
quick-xml = "0.42"
sha2 = "0.11.0"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# `.ctzx` encryption. Both are RustCrypto crates; nothing here invents a cipher
# or a KDF, and both are on the hot path only while exporting or importing.
argon2 = "0.5"
aes-gcm = "0.10"
# Outbound HTTP for AI providers. `rustls-tls` keeps the build free of a
# system OpenSSL, which is the usual cross-platform build breaker.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
  "charset",
  "http2",
  "macos-system-configuration",
] }
futures-util = "0.3"
pdf-extract = "0.12.0"
base64 = "0.23.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
tokio = { version = "1.53.1", features = ["time"] }
tauri-plugin-deep-link = "2.4.10"
# Desktop only, and the crate says so itself (`#![cfg(not(android | ios))]`);
# `run()` gates the registration the same way. Windows and Linux deliver a
# `colorreader://` link to a *new* process, so this is what forwards that
# launch's argv to the instance already running — the `deep-link` feature is
# what lets the handoff reuse the deep-link plugin's event and its single
# argument check rather than a private payload.
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
# Imported StarDict dictionaries ship their bodies as `.dict.dz`. Inflated on
# the way in so a lookup is a seek and a read (see `library/dictionaries.rs`).
flate2 = "1"

# The platform's own dictionary, for the 词典 action's zero-config layer. macOS
# only, because DictionaryServices is macOS only. `core-foundation-sys` is
# already in the tree (Tauri pulls it in), so this adds no new download — it just
# makes the CFString calls in `dictionary.rs` nameable from here.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
