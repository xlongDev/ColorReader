[package]
name = "colorreader"
version = "0.1.0"
description = "ColorReader - AI native, local first, high performance ebook reader"
authors = ["xlongDev"]
edition = "2024"
rust-version = "1.90"
default-run = "colorreader"

[lib]
name = "colorreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is the menu-bar icon. It is what keeps a read-aloud session
# reachable once the window is closed: the window hides rather than quits (see
# `run`), so without this the only way back would be the Dock, and the only way
# to pause would be to bring the whole app forward.
#
# `image-png` is what decodes `icons/trayTemplate.png` at runtime — Tauri's own
# `image` dependency stays optional, and the bundled window icon is decoded at
# build time by `tauri-codegen` instead, so it does not cover this.
#
# `macos-private-api` is what makes the floating bar's window transparent, which
# is the whole shape of it: the bar is a capsule lying on the desktop, and an
# opaque window would put it in a rectangle. It is only read on macOS, and it
# costs nothing outside the App Store — this app ships DMGs from GitHub
# Releases, which the flag does not affect.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zip = "9"
quick-xml = "0.42"
sha2 = "0.11.0"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# `.ctzx` encryption. Both are RustCrypto crates; nothing here invents a cipher
# or a KDF, and both are on the hot path only while exporting or importing.
argon2 = "0.6"
aes-gcm = "0.11"
# Outbound HTTP for AI providers. `rustls` keeps the build free of a system
# OpenSSL, which is the usual cross-platform build breaker; `system-proxy` is
# what makes reqwest honour the OS proxy settings (the 0.12 feature of that
# name, `macos-system-configuration`, was folded into it).
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
  "stream",
  "charset",
  "http2",
  "query",
  "system-proxy",
] }
futures-util = "0.3"
pdf-extract = "0.12.0"
base64 = "0.23.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
tokio = { version = "1.53.1", features = ["time"] }
tauri-plugin-deep-link = "2.4.10"
# Auto-update. The signature the updater insists on is a minisign keypair we
# generate ourselves (`tauri signer generate`), **not** an Apple / Microsoft
# certificate: the key proves the artifact came from us, and it is the only
# thing the updater needs. Platform code signing is a separate concern that
# only affects the first-run trust prompt.
tauri-plugin-updater = "2"
# Installing an update replaces the running bundle, so the app has to restart
# itself afterwards; `relaunch()` is this plugin's command, not core's.
tauri-plugin-process = "2"
# Desktop only, and the crate says so itself (`#![cfg(not(android | ios))]`);
# `run()` gates the registration the same way. Windows and Linux deliver a
# `colorreader://` link to a *new* process, so this is what forwards that
# launch's argv to the instance already running — the `deep-link` feature is
# what lets the handoff reuse the deep-link plugin's event and its single
# argument check rather than a private payload.
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
# Imported StarDict dictionaries ship their bodies as `.dict.dz`. Inflated on
# the way in so a lookup is a seek and a read (see `library/dictionaries.rs`).
flate2 = "1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"

# The platform's own dictionary, for the 词典 action's zero-config layer. macOS
# only, because DictionaryServices is macOS only. `core-foundation-sys` is
# already in the tree (Tauri pulls it in), so this adds no new download — it just
# makes the CFString calls in `dictionary.rs` nameable from here.
#
# The objc2 set below is the same story: Tauri/wry's whole macOS half is built on
# them, so every crate here is already resolved in `Cargo.lock` — naming them
# directly only buys visibility of the two frameworks the region snapshot needs
# (`WKWebView.takeSnapshotWithConfiguration:`, `NSBitmapImageRep`), not new code.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = [
  "NSData",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSString",
] }
objc2-app-kit = { version = "0.3.2", features = ["NSBitmapImageRep", "NSImage"] }
objc2-web-kit = { version = "0.3.2", features = [
  "WKWebView",
  "WKSnapshotConfiguration",
  "block2",
] }
block2 = "0.6.2"

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.release.package.pdf-extract]
opt-level = 3

[profile.release.package.lopdf]
opt-level = 3
