<!doctype html>
<html lang="zh-CN" data-theme="dark" data-transparency="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ColorReader</title>
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the persisted theme before paint to avoid a flash of the wrong background.
      // Mirrors the logic in src/stores/settings.ts; keep in sync.
      (function () {
        try {
          var raw = localStorage.getItem("colorreader.settings");
          var theme = "system";
          if (raw) {
            var parsed = JSON.parse(raw);
            theme = (parsed && parsed.state && parsed.state.theme) || "system";
          }
          var resolved = theme;
          if (theme === "system") {
            resolved = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
